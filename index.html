<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivo D.S.F.R. · Daniel Stiven Fabra Rodríguez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blanco:#ffffff;
  --gris-claro:#f5f5f7;
  --gris-medio:#e8e8ed;
  --linea:#d2d2d7;
  --tinta:#1d1d1f;
  --tenue:#6e6e73;
  --tenue-2:#86868b;
  --acento:#9a6b3a;
  --acento-suave:#f2e6d3;
  --antes-bg:#eeeeef;
  --despues-bg:#1d1d1f;
  --despues-texto:#f5f5f7;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'JetBrains Mono', monospace;
  --ease: cubic-bezier(.4,0,.2,1);
}
*{margin:0; padding:0; box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--blanco); color:var(--tinta); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow-x:hidden; letter-spacing:-.01em;
}
::selection{background:var(--tinta); color:var(--blanco);}
a{color:inherit; text-decoration:none;}
img,video{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
::-webkit-scrollbar{width:0; height:0;}
a:focus-visible, button:focus-visible{outline:2px solid var(--acento); outline-offset:3px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
}

/* ============ NAV (barra superior estilo Apple) ============ */
.topnav{
  position:fixed; top:0; left:0; right:0; z-index:300;
  background:rgba(255,255,255,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.tn-inner{max-width:1100px; margin:0 auto; padding:0 22px; height:52px; display:flex; align-items:center; justify-content:space-between;}
.tn-logo{font-family:var(--sans); font-weight:600; font-size:14px; letter-spacing:0;}
.tn-links{display:flex; gap:2px;}
.tn-link{font-size:12.5px; font-weight:500; color:var(--tenue); padding:8px 14px; border-radius:6px; transition:color .2s, background .2s;}
.tn-link:hover{color:var(--tinta);}
.tn-link.is-on{color:var(--tinta); background:var(--gris-claro);}
@media(max-width:640px){
  .tn-inner{padding:0 16px;}
  .tn-links{gap:0;}
  .tn-link{padding:8px 9px; font-size:11px;}
}

.main{padding-top:52px;}
.wrap{max-width:1100px; margin:0 auto; padding:0 22px;}
@media(max-width:640px){.wrap{padding:0 20px;}}

.reveal{opacity:0; transform:translateY(24px); transition:opacity .8s var(--ease), transform .8s var(--ease);}
.reveal.is-visible{opacity:1; transform:translateY(0);}
.reveal-scale{opacity:0; transform:scale(.94); transition:opacity 1s var(--ease), transform 1s var(--ease);}
.reveal-scale.is-visible{opacity:1; transform:scale(1);}

/* ============ HOME ============ */
.hero{min-height:92vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:100px 22px 60px;}
.hero-kicker{font-size:14px; font-weight:600; color:var(--acento); margin-bottom:20px; letter-spacing:.01em;}
.hero h1{font-size:clamp(40px,7vw,88px); font-weight:700; line-height:1.04; letter-spacing:-.02em; max-width:900px;}
.hero-dek{font-size:clamp(19px,2.2vw,26px); font-weight:500; color:var(--tenue); max-width:680px; margin-top:24px; line-height:1.4; letter-spacing:0;}
.hero-row{display:flex; gap:14px; margin-top:40px; flex-wrap:wrap; justify-content:center;}
.btn{font-size:16px; font-weight:500; padding:13px 26px; border-radius:980px; transition:transform .2s var(--ease), background .2s;}
.btn:hover{transform:scale(1.03);}
.btn-fill{background:var(--tinta); color:var(--blanco);}
.btn-fill:hover{background:#000;}
.btn-line{background:var(--gris-claro); color:var(--tinta);}
.btn-line:hover{background:var(--gris-medio);}

.stats-strip{background:var(--gris-claro); padding:80px 22px;}
.stats-grid{max-width:1000px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center;}
@media(max-width:760px){.stats-grid{grid-template-columns:repeat(2,1fr); gap:36px;}}
.stat-n{font-size:clamp(26px,3.4vw,40px); font-weight:700; letter-spacing:-.02em;}
.stat-l{font-size:14px; color:var(--tenue); margin-top:6px; font-weight:500;}

.intro-section{padding:130px 22px; max-width:780px; margin:0 auto; text-align:center;}
.intro-section p{font-size:clamp(21px,2.6vw,30px); font-weight:600; line-height:1.4; letter-spacing:-.015em; color:var(--tinta);}
.intro-section p + p{margin-top:32px; font-weight:400; font-size:clamp(17px,2vw,20px); color:var(--tenue); line-height:1.55;}
.intro-section a{color:var(--acento); font-weight:600; display:inline-block; margin-top:28px; font-size:16px;}

.frentes-section{padding:0 22px 140px;}
.frentes-title{text-align:center; font-size:clamp(28px,3.6vw,42px); font-weight:700; letter-spacing:-.02em; margin-bottom:56px;}
.frentes-grid{max-width:1000px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--linea); border-radius:24px; overflow:hidden;}
@media(max-width:860px){.frentes-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.frentes-grid{grid-template-columns:1fr;}}
.frente-card{background:var(--blanco); padding:40px 32px; cursor:pointer; transition:background .25s;}
.frente-card:hover{background:var(--gris-claro);}
.frente-num{font-family:var(--mono); font-size:12px; color:var(--tenue-2);}
.frente-name{font-size:22px; font-weight:700; margin-top:14px; letter-spacing:-.01em;}
.frente-count{font-size:14px; color:var(--tenue); margin-top:6px;}

/* ============ CATÁLOGO ============ */
.obras-hero{padding:120px 22px 60px; text-align:center;}
.obras-hero h1{font-size:clamp(34px,5vw,56px); font-weight:700; letter-spacing:-.02em;}
.obras-hero p{font-size:18px; color:var(--tenue); max-width:560px; margin:18px auto 0; line-height:1.5;}

.grupo-section{padding:100px 0; border-top:1px solid var(--linea);}
.grupo-head{text-align:center; max-width:640px; margin:0 auto 64px;}
.grupo-title{font-size:clamp(30px,4vw,44px); font-weight:700; letter-spacing:-.02em;}
.grupo-desc{font-size:16px; color:var(--tenue); margin-top:16px; line-height:1.6;}

.items-row{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;}
.item-card{border-radius:20px; overflow:hidden; cursor:pointer; background:var(--gris-claro); transition:transform .35s var(--ease), box-shadow .35s var(--ease);}
.item-card:hover{transform:translateY(-6px); box-shadow:0 30px 60px -20px rgba(0,0,0,.18);}
.ic-media{aspect-ratio:4/3; position:relative; overflow:hidden; background:var(--gris-medio);}
.ic-media img{width:100%; height:100%; object-fit:cover; object-position:top; transition:transform .5s var(--ease);}
.item-card:hover .ic-media img{transform:scale(1.05);}
.ic-tag{position:absolute; top:14px; left:14px; font-size:11px; font-weight:700; padding:6px 12px; border-radius:980px; letter-spacing:.02em;}
.tag-antes{background:rgba(255,255,255,.9); color:var(--tinta); backdrop-filter:blur(6px);}
.tag-despues{background:var(--tinta); color:#fff;}
.ic-info{padding:20px 22px 24px;}
.ic-title{font-size:17px; font-weight:600; letter-spacing:-.01em;}
.ic-meta{font-size:13px; color:var(--tenue); margin-top:5px;}

/* Dossier: pantalla completa */
.dossier-overlay{position:fixed; inset:0; z-index:500; background:var(--blanco); display:none; overflow-y:auto;}
.dossier-overlay.is-open{display:block;}
.dossier-nav{position:sticky; top:0; z-index:10; background:rgba(255,255,255,.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--linea); padding:16px 22px; display:flex; justify-content:space-between; align-items:center;}
.dossier-close{font-size:14px; font-weight:600; padding:9px 18px; border-radius:980px; background:var(--gris-claro);}
.dossier-close:hover{background:var(--gris-medio);}

/* --- El corazón del rediseño: comparador Antes/Después vertical, con scroll y énfasis --- */
.compare-stage{max-width:900px; margin:0 auto; padding:60px 22px 40px; text-align:center;}
.compare-eyebrow{font-size:14px; font-weight:600; color:var(--acento);}
.compare-title{font-size:clamp(32px,5vw,52px); font-weight:700; letter-spacing:-.02em; margin-top:14px;}
.compare-summary{font-size:17px; color:var(--tenue); max-width:640px; margin:20px auto 0; line-height:1.55;}

.cmp-block{padding:70px 22px; display:flex; flex-direction:column; align-items:center; text-align:center;}
.cmp-block.antes{background:var(--antes-bg); color:var(--tinta);}
.cmp-block.despues{background:var(--despues-bg); color:var(--despues-texto);}
.cmp-label{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:7px 16px; border-radius:980px; margin-bottom:24px;}
.cmp-block.antes .cmp-label{background:rgba(0,0,0,.08); color:var(--tenue);}
.cmp-block.despues .cmp-label{background:rgba(255,255,255,.12); color:#fff;}
.cmp-media{max-width:820px; width:100%; border-radius:20px; overflow:hidden; box-shadow:0 40px 80px -30px rgba(0,0,0,.35);}
.cmp-block.antes .cmp-media{box-shadow:0 30px 60px -25px rgba(0,0,0,.18);}
.cmp-media img, .cmp-media video{width:100%; display:block;}
.cmp-caption{max-width:560px; margin-top:28px; font-size:16px; line-height:1.6; opacity:.85;}
.cmp-arrow{font-size:28px; margin:8px 0; opacity:.4;}

.viewer-tabs-wrap{padding:56px 22px 20px; max-width:900px; margin:0 auto;}
.viewer-tabs{display:flex; gap:2px; background:var(--gris-claro); border-radius:12px; padding:4px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.vt-btn{font-size:13px; font-weight:600; padding:10px 18px; border-radius:9px; color:var(--tenue); white-space:nowrap; flex-shrink:0;}
.vt-btn.is-on{background:var(--blanco); color:var(--tinta); box-shadow:0 2px 10px rgba(0,0,0,.08);}
.viewer-embed-wrap{max-width:900px; margin:0 auto; padding:0 22px 60px;}
.viewer-frame{border:1px solid var(--linea); border-radius:16px; overflow:hidden; background:#fff;}
.viewer-frame iframe, .viewer-frame video{width:100%; height:640px; border:none; display:block;}
.viewer-toolbar{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--linea); font-size:12.5px; color:var(--tenue); background:var(--gris-claro);}
.viewer-toolbar a{color:var(--acento); font-weight:600;}
.pdf-viewer{background:var(--gris-claro); padding:24px; max-height:760px; overflow-y:auto;}
.pdf-viewer canvas{display:block; margin:0 auto 16px; box-shadow:0 6px 24px rgba(0,0,0,.15); max-width:100%; height:auto; border-radius:6px;}
.pdf-loading{padding:60px 20px; text-align:center; font-size:14px; color:var(--tenue);}

.facts-wrap{max-width:900px; margin:0 auto; padding:0 22px 60px;}
.facts-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:640px){.facts-grid{grid-template-columns:1fr;}}
.fact-card{background:var(--gris-claro); border-radius:14px; padding:22px 24px;}
.fact-k{font-size:12px; color:var(--tenue); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.fact-v{font-size:19px; font-weight:700; margin-top:8px; letter-spacing:-.01em;}

.variants-wrap{max-width:900px; margin:0 auto; padding:0 22px 60px;}
.variants-title{font-size:13px; font-weight:600; color:var(--tenue); text-transform:uppercase; letter-spacing:.04em; margin-bottom:18px;}
.variants-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px;}
.variant-item{border-radius:14px; overflow:hidden; cursor:pointer; background:var(--gris-claro); transition:transform .25s var(--ease);}
.variant-item:hover{transform:translateY(-3px);}
.variant-thumb{aspect-ratio:4/3; overflow:hidden;}
.variant-thumb img{width:100%; height:100%; object-fit:cover; object-position:top;}
.variant-label{padding:10px 12px; font-size:13px; font-weight:600;}

.process-wrap{max-width:700px; margin:0 auto; padding:20px 22px 80px;}
.process-title{font-size:13px; font-weight:600; color:var(--tenue); text-transform:uppercase; letter-spacing:.04em; margin-bottom:22px; text-align:center;}
.process-item{display:flex; gap:18px; padding:20px 0; border-bottom:1px solid var(--linea);}
.process-item:last-child{border-bottom:none;}
.process-num{font-size:14px; font-weight:700; color:var(--acento); flex-shrink:0; width:26px;}
.process-text{font-size:15px; color:var(--tenue); line-height:1.65;}

/* ============ MANUAL ============ */
.manual-hero{padding:120px 22px 50px; text-align:center;}
.manual-hero h1{font-size:clamp(32px,4.6vw,50px); font-weight:700; letter-spacing:-.02em; max-width:760px; margin:0 auto;}
.manual-hero p{font-size:17px; color:var(--tenue); max-width:600px; margin:20px auto 0; line-height:1.6;}
.manual-toc{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:36px;}
.toc-pill{font-size:13px; font-weight:600; padding:9px 16px; border-radius:980px; background:var(--gris-claro); color:var(--tenue); transition:background .2s, color .2s;}
.toc-pill:hover{background:var(--tinta); color:#fff;}

.man-section{max-width:760px; margin:0 auto; padding:70px 22px; border-top:1px solid var(--linea);}
.man-h2{font-size:clamp(24px,3vw,32px); font-weight:700; letter-spacing:-.01em; margin-bottom:32px;}
.man-item{background:var(--gris-claro); border-radius:16px; padding:26px 28px; margin-bottom:14px;}
.mi-h{font-size:16.5px; font-weight:600; margin-bottom:10px;}
.mi-body{font-size:14.5px; color:var(--tenue); line-height:1.7;}
.mi-body code{font-family:var(--mono); background:var(--gris-medio); padding:2px 6px; border-radius:5px; font-size:.86em;}
.mi-code{font-family:var(--mono); font-size:13px; line-height:1.7; color:var(--tinta); background:var(--gris-medio); border-radius:10px; padding:18px 20px; white-space:pre-wrap; margin-top:12px;}
.man-step{display:flex; gap:20px; padding:18px 0; border-bottom:1px solid var(--linea);}
.man-step:last-child{border-bottom:none;}
.ms-num{font-size:20px; font-weight:700; color:var(--acento); flex-shrink:0; width:36px;}
.ms-text{font-size:14.5px; color:var(--tenue); line-height:1.7; padding-top:2px;}

/* ============ AUTOR ============ */
.autor-view{padding:120px 22px 100px; max-width:900px; margin:0 auto; text-align:center;}
.autor-photo{width:200px; height:200px; border-radius:50%; overflow:hidden; margin:0 auto 32px; box-shadow:0 20px 50px -20px rgba(0,0,0,.25);}
.autor-photo img{width:100%; height:100%; object-fit:cover;}
.autor-view h2{font-size:clamp(28px,3.6vw,40px); font-weight:700; letter-spacing:-.02em;}
.autor-tag{font-size:14px; color:var(--acento); font-weight:600; margin-top:10px;}
.autor-view p{font-size:17px; color:var(--tenue); line-height:1.65; max-width:600px; margin:24px auto 0;}
.site-footer{border-top:1px solid var(--linea); padding:30px 22px; text-align:center; font-size:12.5px; color:var(--tenue);}
</style>
</head>
<body>
<nav class="topnav">
  <div class="tn-inner">
    <div class="tn-logo">Daniel Stiven Fabra Rodríguez</div>
    <div class="tn-links" id="tnNav">
      <button class="tn-link" data-view="home">Presentación</button>
      <button class="tn-link" data-view="obras">Catálogo</button>
      <button class="tn-link" data-view="manual">Manual</button>
      <button class="tn-link" data-view="autor">Autor</button>
    </div>
  </div>
</nav>
<div class="main" id="mainContent"></div>
<div class="dossier-overlay" id="dossierOverlay"></div>
<script src="resolveAsset.js"></script>
<script src="data.js"></script>
<script src="data_manual.js"></script>
<script src="app_home.js"></script>
<script src="app_obras.js"></script>
<script src="app_manual.js"></script>
<script>
navigate('home');
document.getElementById('dossierOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'dossierOverlay') closeDossier();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeDossier();
});
</script>
</body>
</html>
