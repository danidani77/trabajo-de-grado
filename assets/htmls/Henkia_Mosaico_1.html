<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mosaico · Henkia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --verde-darker: #00170C;
  --verde-dark: #112F24;
  --verde-medio: #09B17B;
  --verde-light: #00BC52;
  --cielo-medio: #9DD8FF;
  --cielo: #B5FDFF;
  --blanco: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--verde-darker);
  color: var(--blanco);
  font-family: 'Sora', sans-serif;
  font-weight: 300;
}

img, svg { display: block; }

.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.kv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.5;
}
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(165deg, #00170C 0%, rgba(9,177,123,0.5) 55%, rgba(157,216,255,0.32) 100%);
}
.overlay-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 38%, rgba(0,23,12,0) 0%, rgba(0,23,12,0.55) 78%, rgba(0,23,12,0.85) 100%);
}

/* ---------- HEADER minimal ---------- */
header.top {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: center;
  padding: clamp(18px, 3vh, 30px) 24px 0;
  flex-shrink: 0;
}
header.top img { height: 18px; max-height: 2.2vh; width: auto; max-width: 140px; opacity: 0.85; }

/* ---------- CONTENT centrado, todo cabe en viewport ---------- */
.content {
  position: relative;
  z-index: 3;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 24px;
  min-height: 0;
  overflow: hidden;
}

.logo-mosaico {
  width: 420px;
  max-width: 100%;
  height: auto;
  max-height: 22vh;
  object-fit: contain;
  filter: drop-shadow(0 8px 40px rgba(0,23,12,0.35));
}

.tagline-sub {
  font-size: clamp(14px, 1.7vh, 17px);
  color: rgba(255,255,255,0.78);
  text-align: center;
  max-width: 480px;
  line-height: 1.45;
  margin-top: -6px;
}

.cards-row {
  display: flex;
  gap: clamp(10px, 1.6vw, 18px);
  width: 100%;
  max-width: 620px;
  margin-top: clamp(6px, 1.4vh, 14px);
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.16);
  backdrop-filter: blur(6px);
  border-radius: 16px;
  padding: clamp(14px, 2vh, 20px) clamp(16px, 2vw, 22px);
  flex: 1 1 240px;
  max-width: 280px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform .25s ease, background .25s ease, border-color .25s ease;
  opacity: 0;
  animation: cardIn .55s cubic-bezier(.22,.61,.36,1) forwards;
}
.card:hover {
  transform: translateY(-3px);
  background: rgba(255,255,255,0.13);
  border-color: rgba(157,216,255,0.5);
}
.card:nth-child(1) { animation-delay: .55s; }
.card:nth-child(2) { animation-delay: .68s; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.logo-mosaico, .tagline-sub {
  opacity: 0;
  animation: fadeUp .6s cubic-bezier(.22,.61,.36,1) forwards;
}
.logo-mosaico { animation-delay: .08s; }
.tagline-sub { animation-delay: .22s; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .card, .logo-mosaico, .tagline-sub { animation: none !important; opacity: 1 !important; }
}

.card-icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: rgba(255,255,255,0.14);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-icon svg { width: 18px; height: 18px; fill: var(--cielo); }

.card h3 {
  font-family: 'Darker Grotesque', sans-serif;
  font-weight: 400;
  font-size: clamp(16px, 2vh, 19px);
  color: var(--blanco);
}
.card .desc {
  font-size: clamp(11.5px, 1.4vh, 13px);
  color: rgba(255,255,255,0.68);
  line-height: 1.4;
}
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 2px;
}
.status-tag {
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(157,216,255,0.16);
  color: var(--cielo);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.status-tag svg { width: 11px; height: 11px; fill: var(--cielo); }
.go-arrow {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s, transform .2s;
}
.go-arrow svg { width: 13px; height: 13px; fill: rgba(255,255,255,0.85); }
.card:hover .go-arrow { background: var(--verde-medio); transform: translateX(2px); }

/* ---------- FOOTER minimal ---------- */
footer {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 0 24px clamp(16px, 2.6vh, 26px);
  flex-shrink: 0;
}
footer .tagline {
  font-size: clamp(10.5px, 1.3vh, 12px);
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.02em;
}

@media (max-height: 640px) {
  .content { gap: 10px; }
  .cards-row { margin-top: 6px; }
}
</style>
</head>
