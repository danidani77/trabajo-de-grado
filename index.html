<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivo D.S.F.R. · Daniel Stiven Fabra Rodríguez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#f7f3ea;
  --fondo-2:#efe8d8;
  --panel:#ffffff;
  --panel-2:#f2ecdd;
  --linea:#e0d6bc;
  --linea-fuerte:#cbbd94;
  --tinta:#2b2717;
  --tenue:#7d7458;
  --tenue-2:#a89d7c;
  --senal:#a8763f;
  --senal-dim:#8a5f30;
  --senal-bg:#efd9b8;
  --legado:#6b6455;
  --legado-bg:#e6e0d0;
  --display:'Darker Grotesque', sans-serif;
  --body:'Sora', sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{margin:0; padding:0; box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--fondo); color:var(--tinta); font-family:var(--body);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:var(--senal); color:#fff;}
a{color:inherit; text-decoration:none;}
img,video{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--fondo);}
::-webkit-scrollbar-thumb{background:var(--linea-fuerte); border-radius:10px;}
a:focus-visible, button:focus-visible{outline:2px solid var(--senal); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
}
.shell{display:flex;}
.sidebar{
  width:84px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--linea);
  display:flex; flex-direction:column; align-items:center; padding:26px 0;
  position:fixed; top:0; bottom:0; left:0; z-index:200;
}
.sb-logo{font-family:var(--display); font-weight:800; font-size:15px; color:var(--senal); writing-mode:vertical-rl; letter-spacing:.06em; margin-bottom:48px;}
.sb-nav{display:flex; flex-direction:column; gap:6px; flex:1;}
.sb-item{
  width:52px; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px; border-radius:8px; color:var(--tenue); transition:background .2s, color .2s; position:relative;
}
.sb-item svg{width:19px; height:19px;}
.sb-item .lbl{font-family:var(--mono); font-size:8.5px; letter-spacing:.03em; text-transform:uppercase;}
.sb-item:hover{color:var(--tinta); background:var(--panel-2);}
.sb-item.is-on{color:var(--senal); background:var(--senal-bg);}
.sb-item.is-on::before{content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%); width:3px; height:20px; background:var(--senal); border-radius:0 3px 3px 0;}
.sb-foot{font-family:var(--mono); font-size:9px; color:var(--tenue-2); writing-mode:vertical-rl; letter-spacing:.05em;}
@media(max-width:820px){
  .sidebar{width:100%; height:60px; flex-direction:row; top:auto; bottom:0; left:0; right:0; border-right:none; border-top:1px solid var(--linea); padding:0 6px; justify-content:space-around;}
  .sb-logo{display:none;}
  .sb-nav{flex-direction:row; flex:1; justify-content:space-around;}
  .sb-item.is-on::before{left:50%; top:-9px; transform:translateX(-50%); width:20px; height:3px; border-radius:3px 3px 0 0;}
  .sb-foot{display:none;}
}
.main{flex:1; margin-left:84px; min-width:0;}
@media(max-width:820px){.main{margin-left:0; margin-bottom:60px;}}
.wrap{max-width:1240px; margin:0 auto; padding:0 44px;}
@media(max-width:1000px){.wrap{padding:0 28px;}}
@media(max-width:560px){.wrap{padding:0 20px;}}
.reveal{opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease;}
.reveal.is-visible{opacity:1; transform:translateY(0);}
.home-hero{min-height:92svh; display:flex; flex-direction:column; justify-content:center; position:relative; padding:80px 0 70px; overflow:hidden;}
.home-hero::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(650px 420px at 10% 10%, rgba(168,118,63,.07), transparent), radial-gradient(550px 550px at 90% 80%, rgba(168,118,63,.05), transparent);}
.hh-kicker{font-family:var(--mono); font-size:12px; color:var(--senal); letter-spacing:.12em; text-transform:uppercase; margin-bottom:26px; display:flex; align-items:center; gap:10px;}
.hh-kicker .dot{width:6px; height:6px; border-radius:50%; background:var(--senal);}
.home-hero h1{font-family:var(--display); font-weight:700; line-height:.98; font-size:clamp(38px,6.2vw,76px); letter-spacing:-.01em; max-width:960px;}
.hh-dek{font-size:clamp(16px,1.7vw,19.5px); color:var(--tenue); max-width:660px; margin-top:26px; line-height:1.65; font-weight:400;}
.hh-body{font-size:14.5px; color:#4a4530; max-width:660px; margin-top:20px; line-height:1.8;}
.hh-body strong{font-weight:600; color:var(--tinta);}
.hh-row{display:flex; gap:14px; margin-top:36px; flex-wrap:wrap;}
.btn{font-family:var(--mono); font-size:12.5px; padding:13px 22px; border-radius:8px; letter-spacing:.02em; transition:transform .2s, background .2s, border-color .2s; display:inline-flex; align-items:center; gap:8px;}
.btn:hover{transform:translateY(-2px);}
.btn-fill{background:var(--tinta); color:var(--fondo); font-weight:700;}
.btn-fill:hover{background:var(--senal);}
.btn-line{border:1px solid var(--linea-fuerte); color:var(--tinta);}
.btn-line:hover{border-color:var(--senal); color:var(--senal);}
.colofon{border-top:1px solid var(--linea); margin-top:64px; padding-top:30px;}
.colofon-grid{display:grid; grid-template-columns:repeat(4,auto); gap:40px;}
@media(max-width:760px){.colofon-grid{grid-template-columns:repeat(2,1fr); gap:26px;}}
.cf-n{font-family:var(--display); font-weight:800; font-size:32px; color:var(--tinta); line-height:1;}
.cf-l{font-family:var(--mono); font-size:10.5px; color:var(--tenue-2); margin-top:6px; letter-spacing:.03em; text-transform:uppercase;}
.home-intro{padding:100px 0; border-top:1px solid var(--linea);}
.intro-grid{display:grid; grid-template-columns:.5fr 1fr; gap:64px;}
@media(max-width:860px){.intro-grid{grid-template-columns:1fr;}}
.intro-label{font-family:var(--mono); font-size:11px; color:var(--tenue); text-transform:uppercase; letter-spacing:.1em; padding-top:6px;}
.intro-text p{font-size:15.5px; line-height:1.85; color:#4a4530; margin-bottom:20px; max-width:660px;}
.intro-text p strong{color:var(--tinta); font-weight:600;}
.intro-text a{color:var(--senal); font-family:var(--mono); font-size:13px;}
.eyebrow{font-family:var(--mono); font-size:11.5px; color:var(--senal-dim); letter-spacing:.12em; text-transform:uppercase; margin-bottom:16px;}
.h2{font-family:var(--display); font-weight:700; font-size:clamp(26px,3.8vw,42px); line-height:1.05;}
.cat-preview{padding:0 0 110px;}
.cp-head{margin-bottom:36px;}
.cp-title{font-family:var(--display); font-weight:700; font-size:clamp(24px,3.2vw,34px);}
.cat-list{border-top:1px solid var(--linea-fuerte);}
.cat-row{display:grid; grid-template-columns:56px 1fr auto; gap:24px; align-items:center; padding:26px 0; border-bottom:1px solid var(--linea); cursor:pointer; transition:background .2s;}
.cat-row:hover{background:var(--panel-2);}
@media(max-width:640px){.cat-row{grid-template-columns:36px 1fr;} .cr-arrow{display:none;}}
.cr-num{font-family:var(--mono); font-size:12.5px; color:var(--tenue-2);}
.cr-title{font-family:var(--display); font-weight:700; font-size:22px;}
.cr-tag{font-family:var(--body); font-size:12.5px; color:var(--tenue); margin-top:3px;}
.cr-arrow{font-family:var(--display); font-size:22px; color:var(--senal);}
.obras-head{padding:64px 0 40px; border-bottom:1px solid var(--linea);}
.obras-groups{padding:52px 0 110px;}
.og-section{margin-bottom:96px;}
.og-title{font-family:var(--display); font-weight:700; font-size:clamp(24px,3vw,32px); padding-bottom:18px; border-bottom:1px solid var(--linea-fuerte); margin-bottom:12px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;}
.og-count{font-family:var(--mono); font-size:11.5px; color:var(--tenue); text-transform:uppercase; letter-spacing:.04em;}
.og-desc{font-size:14.5px; color:var(--tenue); max-width:720px; line-height:1.75; margin:18px 0 36px;}
.items-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media(max-width:1000px){.items-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.items-grid{grid-template-columns:1fr;}}
.item-card{background:var(--panel); border:1px solid var(--linea); border-radius:14px; overflow:hidden; cursor:pointer; transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;}
.item-card:hover{transform:translateY(-4px); box-shadow:0 20px 40px -20px rgba(43,39,23,.18); border-color:var(--senal-dim);}
.ic-thumb{aspect-ratio:4/3; min-height:190px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.ic-thumb img{width:100%; height:100%; object-fit:cover; object-position:top; max-width:none; display:block;}
.ic-thumb.origen{background:var(--legado-bg);}
.ic-thumb.resultado{background:linear-gradient(135deg, var(--senal-bg), #f4e6c8);}
.ic-badge{position:absolute; top:12px; left:12px; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; padding:5px 10px; border-radius:20px; letter-spacing:.05em; z-index:2;}
.badge-legado{background:var(--legado); color:#fff;}
.badge-actual{background:var(--senal); color:#fff;}
.ic-body{padding:18px 20px 22px;}
.ic-title{font-family:var(--display); font-weight:700; font-size:18px; line-height:1.25;}
.ic-meta{font-family:var(--mono); font-size:10px; color:var(--tenue); margin-top:5px; text-transform:uppercase; letter-spacing:.03em;}
.dossier-overlay{position:fixed; inset:0; z-index:500; background:var(--fondo); display:none; overflow-y:auto;}
.dossier-overlay.is-open{display:block;}
.dossier-topbar{position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--linea); padding:18px 48px; display:flex; justify-content:space-between; align-items:center;}
@media(max-width:640px){.dossier-topbar{padding:16px 20px;}}
.dossier-close{font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.04em; padding:10px 18px; border:1px solid var(--linea-fuerte); border-radius:7px;}
.dossier-close:hover{background:var(--tinta); color:var(--fondo); border-color:var(--tinta);}
.dossier-body{max-width:1180px; margin:0 auto; padding:48px 48px 100px;}
@media(max-width:1000px){.dossier-body{padding:36px 28px 80px;}}
@media(max-width:640px){.dossier-body{padding:28px 20px 60px;}}
.dossier-eyebrow{font-family:var(--mono); font-size:12px; color:var(--senal); text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px;}
.dossier-title{font-family:var(--display); font-weight:700; font-size:clamp(30px,4.4vw,52px); line-height:1.05; margin-bottom:22px;}
.dossier-summary{font-size:16px; line-height:1.8; color:var(--tenue); max-width:780px; margin-bottom:40px;}
.viewer-tabs{display:flex; gap:2px; background:var(--fondo-2); border-radius:9px; padding:4px; width:fit-content;}
.vt-btn{font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.03em; padding:9px 18px; border-radius:6px; color:var(--tenue);}
.vt-btn.is-on{background:var(--panel); color:var(--senal); box-shadow:0 2px 8px rgba(43,39,23,.08);}
.viewer-frame{border:1px solid var(--linea-fuerte); border-radius:12px; overflow:hidden; margin-top:16px; background:#fff;}
.viewer-frame iframe, .viewer-frame video{width:100%; height:680px; border:none; display:block;}
.viewer-toolbar{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--linea); font-size:10.5px; color:var(--tenue); background:var(--fondo-2); font-family:var(--mono);}
.viewer-toolbar a{color:var(--senal-dim); font-weight:600;}
.pdf-viewer{background:var(--fondo-2); padding:24px; max-height:760px; overflow-y:auto;}
.pdf-viewer canvas{display:block; margin:0 auto 16px; box-shadow:0 6px 24px rgba(43,39,23,.15); max-width:100%; height:auto; border-radius:6px;}
.pdf-loading{padding:60px 20px; text-align:center; font-size:14px; color:var(--tenue);}
.dossier-facts{margin-top:32px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:640px){.dossier-facts{grid-template-columns:1fr;}}
.fact-card, .dossier-facts .df-item{background:var(--panel-2); border-radius:14px; padding:22px 24px; border:1px solid var(--linea);}
.fact-k, .df-k{font-size:12px; color:var(--tenue); font-weight:600; text-transform:uppercase; letter-spacing:.03em; font-family:var(--mono);}
.fact-v, .df-v{font-family:var(--display); font-size:19px; font-weight:700; margin-top:8px; letter-spacing:-.01em;}
.variants-wrap, .dossier-variants{margin-top:44px;}
.variants-title, .dv-title{font-size:13px; font-weight:600; color:var(--tenue); text-transform:uppercase; letter-spacing:.04em; margin-bottom:18px; font-family:var(--mono); padding-bottom:12px; border-bottom:1px solid var(--linea);}
.variants-grid, .dv-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px;}
.variant-item, .dv-item{border-radius:14px; overflow:hidden; cursor:pointer; background:var(--panel-2); transition:transform .25s ease; border:1px solid var(--linea);}
.variant-item:hover, .dv-item:hover{transform:translateY(-3px); border-color:var(--senal-dim);}
.variant-thumb, .dv-thumb{aspect-ratio:4/3; overflow:hidden;}
.variant-thumb img, .dv-thumb img{width:100%; height:100%; object-fit:cover; object-position:top;}
.variant-label, .dv-label{padding:10px 12px; font-size:13px; font-weight:600;}
.process-wrap{max-width:700px; margin:0 auto; padding:20px 22px 80px;}
.process-title{font-size:13px; font-weight:600; color:var(--tenue); text-transform:uppercase; letter-spacing:.04em; margin-bottom:22px; text-align:center; font-family:var(--mono);}
.proc-list{margin-top:8px;}
.proc-item, .process-item{display:flex; gap:20px; padding:18px 0; border-bottom:1px solid var(--linea);}
.proc-item:last-child, .process-item:last-child{border-bottom:none;}
.proc-num, .process-num{font-family:var(--display); font-weight:700; font-size:20px; color:var(--senal-dim); flex-shrink:0; width:34px;}
.proc-text, .process-text{font-size:14px; color:#4a4530; line-height:1.8;}
.manual-head{padding:70px 0 36px; border-bottom:1px solid var(--linea);}
.manual-toc{display:flex; gap:8px; flex-wrap:wrap; margin-top:32px;}
.toc-link, .toc-pill{font-family:var(--mono); font-size:11.5px; padding:9px 16px; border:1px solid var(--linea-fuerte); border-radius:20px; color:var(--tenue); transition:color .2s, border-color .2s;}
.toc-link:hover, .toc-pill:hover{color:var(--senal); border-color:var(--senal);}
.man-section{padding:60px 0; border-bottom:1px solid var(--linea); scroll-margin-top:24px;}
.man-h2{font-family:var(--display); font-weight:700; font-size:clamp(22px,2.8vw,30px); margin-bottom:32px;}
.man-items{display:flex; flex-direction:column; gap:14px;}
.man-item{background:var(--panel); border:1px solid var(--linea); border-radius:12px; padding:26px 28px;}
@media(max-width:600px){.man-item{padding:18px;}}
.mi-h{font-family:var(--body); font-weight:600; font-size:16.5px; margin-bottom:12px;}
.mi-body{font-size:13.5px; color:var(--tenue); line-height:1.85;}
.mi-body code{font-family:var(--mono); background:var(--fondo-2); border:1px solid var(--linea); padding:2px 6px; border-radius:4px; font-size:.86em; color:var(--senal-dim);}
.mi-code{font-family:var(--mono); font-size:12.5px; line-height:1.7; color:var(--tinta); background:var(--fondo-2); border:1px solid var(--linea); border-radius:8px; padding:18px 20px; white-space:pre-wrap; margin-top:12px;}
.man-steps{display:flex; flex-direction:column;}
.man-step{display:flex; gap:22px; padding:20px 0; border-bottom:1px solid var(--linea);}
.man-step:last-child{border-bottom:none;}
.ms-num{font-family:var(--display); font-weight:700; font-size:24px; color:var(--senal-dim); flex-shrink:0; width:42px;}
.ms-text{font-size:14.5px; color:var(--tenue); line-height:1.85; padding-top:3px;}
.autor-view{padding:88px 0 100px;}
.autor-grid{display:grid; grid-template-columns:.8fr 1.2fr; gap:60px; align-items:center;}
@media(max-width:800px){.autor-grid{grid-template-columns:1fr;}}
.autor-photo{max-width:360px; position:relative; margin-bottom:26px;}
.autor-photo img{border-radius:12px; border:1px solid var(--linea-fuerte);}
.autor-tag{position:absolute; bottom:-14px; left:-14px; background:var(--senal); color:#fff; font-family:var(--mono); font-size:10.5px; padding:9px 14px; border-radius:6px; font-weight:700;}
.autor-body h2{font-family:var(--display); font-weight:700; font-size:clamp(26px,3.4vw,38px); margin-bottom:20px; line-height:1.08;}
.autor-body p{font-size:15px; line-height:1.85; color:var(--tenue); margin-bottom:16px; max-width:560px;}
.site-footer{border-top:1px solid var(--linea); padding:32px 0; text-align:center;}
.footer-row{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-family:var(--mono); font-size:11px; color:var(--tenue-2);}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sb-logo">DSFR</div>
    <nav class="sb-nav" id="sbNav">
      <button class="sb-item" data-view="home" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span class="lbl">Inicio</span>
      </button>
      <button class="sb-item" data-view="obras" aria-label="Catálogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="lbl">Catálogo</span>
      </button>
      <button class="sb-item" data-view="manual" aria-label="Manual">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22.5v-18Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>
        <span class="lbl">Manual</span>
      </button>
      <button class="sb-item" data-view="autor" aria-label="Autor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 21c1-4 4-6 7-6s6 2 7 6"/></svg>
        <span class="lbl">Autor</span>
      </button>
    </nav>
    <div class="sb-foot">Henkia · 2026</div>
  </aside>
  <div class="main" id="mainContent"></div>
</div>
<div class="dossier-overlay" id="dossierOverlay"></div>
<script src="resolveAsset.js"></script>
<script src="data.js"></script>
<script src="data_manual.js"></script>
<script src="app_home.js"></script>
<script src="app_obras.js"></script>
<script src="app_manual.js"></script>
<script>
navigate('home');
document.getElementById('dossierOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'dossierOverlay') closeDossier();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeDossier();
});
</script>
</body>
</html>
