<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicios Administrativos · Henkia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;600&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-darker:#00170C;
    --verde-dark:#112F24;
    --verde-medio:#09B17B;
    --verde-light:#00BC52;
    --cielo-medio:#9DD8FF;
    --cielo:#B5FDFF;
    --blanco:#FFFFFF;

    /* Paleta clara (micrositios nuevos) */
    --bg-claro:#EEF3F0;
    --bg-card:#FFFFFF;
    --borde-claro:rgba(17,47,36,0.13);
    --texto-principal:#0C1F17;
    --texto-secundario:rgba(12,31,23,0.62);
    --texto-terciario:rgba(12,31,23,0.42);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Sora',sans-serif;
    font-weight:300;
    background:var(--bg-claro);
    color:var(--texto-principal);
    overflow-x:hidden;
  }

  h1,h2,h3,h4{
    font-family:'Darker Grotesque',sans-serif;
    font-weight:300;
    line-height:1.05;
    letter-spacing:0;
  }

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* ===== LAYOUT ===== */
  .app{position:relative;min-height:100vh;}

  .view{display:none;min-height:100vh;}
  .view.active{display:block;}

  .wrap{max-width:1120px;margin:0 auto;padding:0 32px;}

  /* ===== HEADER ===== */
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(246,248,247,0.86);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--borde-claro);
  }
  .header-inner{
    max-width:1120px;margin:0 auto;padding:18px 32px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .header-logo{height:22px;display:flex;align-items:center;flex-shrink:0;}
  .header-logo img{height:100%;width:auto;display:block;}

  .breadcrumb{
    display:flex;align-items:center;gap:6px;
    font-size:14.5px;color:var(--texto-terciario);
    flex-wrap:wrap;
    min-width:0;
  }
  .breadcrumb button{
    color:var(--texto-terciario);
    transition:color .2s ease;
    white-space:nowrap;
  }
  .breadcrumb button:hover{color:var(--verde-medio);}
  .breadcrumb .crumb-current{color:var(--texto-principal);font-weight:400;white-space:nowrap;}
  .breadcrumb .sep{color:rgba(12,31,23,0.22);flex-shrink:0;}
  .breadcrumb svg{width:16px;height:16px;fill:currentColor;flex-shrink:0;vertical-align:-3px;}

  /* ===== HERO (landing) — se mantiene oscuro como ancla de marca ===== */
  .hero{
    position:relative;
    min-height:72vh;
    display:flex;align-items:flex-end;
    overflow:hidden;
  }
  .hero-kv{
    position:absolute;inset:0;
    background-size:cover;background-position:center 30%;
    filter:saturate(1.05);
  }
  .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(160deg, var(--verde-darker) 0%, rgba(9,177,123,0.55) 55%, rgba(157,216,255,0.28) 100%),
               linear-gradient(0deg, var(--verde-darker) 0%, rgba(0,23,12,0.15) 45%, rgba(0,23,12,0.55) 100%);
  }
  .hero-content{
    position:relative;z-index:2;
    padding:0 32px 60px;
    max-width:1120px;margin:0 auto;width:100%;
  }
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Sora',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cielo-medio);
    margin-bottom:18px;
  }
  .hero-eyebrow::before{
    content:'';width:22px;height:1px;background:var(--cielo-medio);
  }
  .hero h1{
    font-size:clamp(40px,6vw,72px);
    color:var(--blanco);
    max-width:820px;
    margin-bottom:18px;
  }
  .hero p{
    font-size:18px;line-height:1.55;
    color:rgba(255,255,255,0.82);
    max-width:560px;
    font-weight:300;
  }

  /* ===== WATERMARK (subpáginas) — sobre fondo claro ===== */
  .subhero{
    position:relative;
    padding:56px 0 44px;
    overflow:hidden;
    background:linear-gradient(135deg, rgba(9,177,123,0.07) 0%, rgba(157,216,255,0.10) 55%, var(--bg-claro) 100%);
    border-bottom:1px solid var(--borde-claro);
  }
  .subhero-watermark{
    position:absolute;
    top:50%;right:-6%;
    transform:translateY(-50%);
    width:640px;height:auto;
    opacity:0.10;
    pointer-events:none;
    z-index:0;
  }
  .subhero-content{position:relative;z-index:1;}
  .subhero-eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--verde-medio);margin-bottom:14px;
  }
  .subhero-eyebrow::before{content:'';width:22px;height:1px;background:var(--verde-medio);}
  .subhero h2{font-size:clamp(32px,4.5vw,48px);color:var(--texto-principal);max-width:680px;}
  .subhero p{font-size:16.5px;color:var(--texto-secundario);max-width:520px;margin-top:12px;line-height:1.5;}

  /* ===== SECTIONS ===== */
  main{position:relative;}
  section.block{padding:56px 0;}

  .section-title{
    font-size:15px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
    color:var(--verde-medio);
    margin-bottom:24px;
    font-family:'Sora',sans-serif;
  }

  /* ===== GRID DE CARDS (landing) ===== */
  .card-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
  }

  .card{
    position:relative;
    display:flex;flex-direction:column;
    text-align:left;
    background:var(--bg-card);
    border:1px solid var(--borde-claro);
    border-radius:20px;
    padding:28px;
    min-height:200px;
    box-shadow:0 10px 28px -20px rgba(17,47,36,0.16);
    transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    opacity:0;
    transform:translateY(16px);
    animation:cardIn .5s ease forwards;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:rgba(9,177,123,0.4);
    box-shadow:0 20px 40px -24px rgba(17,47,36,0.25);
  }

  .card-icon{
    width:44px;height:44px;
    border-radius:12px;
    background:rgba(9,177,123,0.10);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
    flex-shrink:0;
  }
  .card-icon svg{width:22px;height:22px;fill:var(--verde-medio);}

  .card-status{
    position:absolute;top:24px;right:24px;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--texto-terciario);
    font-family:'Sora',sans-serif;
  }
  .card-status.status-externo{color:var(--verde-medio);}

  .card h3{
    font-size:26px;color:var(--texto-principal);margin-bottom:8px;font-weight:400;
  }
  .card p{
    font-size:14.5px;line-height:1.5;color:var(--texto-secundario);
    margin-bottom:18px;
    flex-grow:1;
  }
  .card-cta{
    display:flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:500;color:var(--verde-medio);
    margin-top:auto;
  }
  .card-cta svg{width:15px;height:15px;fill:currentColor;transition:transform .25s ease;}
  .card:hover .card-cta svg{transform:translateX(3px);}

  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
  .card-grid .card:nth-child(1){animation-delay:.05s;}
  .card-grid .card:nth-child(2){animation-delay:.12s;}
  .card-grid .card:nth-child(3){animation-delay:.19s;}
  .card-grid .card:nth-child(4){animation-delay:.26s;}
  .card-grid .card:nth-child(5){animation-delay:.33s;}

  /* ===== LISTA DE RECURSOS (subpáginas) ===== */
  .resource-list{display:flex;flex-direction:column;gap:14px;}
  .resource-item{
    display:flex;align-items:center;gap:18px;
    padding:22px 26px;
    background:var(--bg-card);
    border:1px solid var(--borde-claro);
    border-radius:16px;
    box-shadow:0 10px 26px -20px rgba(17,47,36,0.15);
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    opacity:0;transform:translateY(14px);
    animation:cardIn .45s ease forwards;
  }
  .resource-item:hover{
    transform:translateY(-3px);
    border-color:rgba(9,177,123,0.35);
    box-shadow:0 16px 32px -22px rgba(17,47,36,0.22);
  }
  .resource-list .resource-item:nth-child(1){animation-delay:.04s;}
  .resource-list .resource-item:nth-child(2){animation-delay:.1s;}
  .resource-list .resource-item:nth-child(3){animation-delay:.16s;}

  .resource-icon{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;
    background:rgba(9,177,123,0.10);
    display:flex;align-items:center;justify-content:center;
  }
  .resource-icon svg{width:22px;height:22px;fill:var(--verde-medio);}

  .resource-body{flex-grow:1;min-width:0;}
  .resource-body h4{font-size:19px;color:var(--texto-principal);font-weight:400;margin-bottom:3px;}
  .resource-body span.tag{
    display:inline-block;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--verde-medio);
    margin-bottom:6px;
  }
  .resource-body p{font-size:14px;color:var(--texto-secundario);line-height:1.5;}

  .resource-cta{
    flex-shrink:0;
    display:flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:500;color:var(--verde-medio);
    white-space:nowrap;
  }
  .resource-cta svg{width:15px;height:15px;fill:currentColor;transition:transform .25s ease;}
  .resource-item:hover .resource-cta svg{transform:translateX(3px);}

  /* Card de plataforma externa con logo propio, clic directo */
  .platform-card{
    display:flex;align-items:center;gap:20px;
    padding:26px;
    background:var(--bg-card);
    border:1px solid var(--borde-claro);
    border-radius:18px;
    box-shadow:0 10px 26px -20px rgba(17,47,36,0.15);
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .platform-card:hover{
    transform:translateY(-3px);
    border-color:rgba(9,177,123,0.4);
    box-shadow:0 16px 32px -22px rgba(17,47,36,0.22);
  }
  .platform-logo-box{
    width:64px;height:64px;flex-shrink:0;
    border-radius:14px;
    background:rgba(9,177,123,0.08);
    display:flex;align-items:center;justify-content:center;
  }
  .platform-logo-box svg{width:30px;height:30px;fill:var(--verde-medio);}
  .platform-body{flex-grow:1;min-width:0;}
  .platform-body span.tag{
    display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--verde-medio);margin-bottom:5px;
  }
  .platform-body h4{font-size:20px;color:var(--texto-principal);font-weight:400;margin-bottom:4px;}
  .platform-body p{font-size:13.5px;color:var(--texto-secundario);line-height:1.45;}

  /* ===== NOTA / callout ===== */
  .callout{
    display:flex;gap:16px;align-items:flex-start;
    padding:22px 24px;
    background:rgba(9,177,123,0.05);
    border:1px dashed rgba(9,177,123,0.3);
    border-radius:16px;
    margin-top:8px;
  }
  .callout-icon{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:rgba(9,177,123,0.12);
    display:flex;align-items:center;justify-content:center;
  }
  .callout-icon svg{width:18px;height:18px;fill:var(--verde-medio);}
  .callout p{font-size:14.5px;line-height:1.55;color:var(--texto-secundario);}
  .callout strong{color:var(--texto-principal);font-weight:500;}

  /* ===== FOOTER ===== */
  footer{
    background:var(--verde-darker);
    padding:36px 0;
    margin-top:40px;
    margin-left:calc(-50vw + 50%);
    margin-right:calc(-50vw + 50%);
    width:100vw;
  }
  .footer-inner{
    max-width:1120px;margin:0 auto;padding:0 32px;
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
  }
  .footer-logo{height:16px;}
  .footer-logo img{height:100%;width:auto;display:block;opacity:0.92;}
  .footer-tagline{font-size:13px;color:rgba(255,255,255,0.5);}

  /* ===== TRANSICIONES DE NAVEGACIÓN ===== */
  .view.dir-forward{animation:slideInFromRight .42s cubic-bezier(.22,.61,.36,1) both;}
  .view.dir-back{animation:slideInFromLeft .42s cubic-bezier(.22,.61,.36,1) both;}
  @keyframes slideInFromRight{from{opacity:0;transform:translateX(36px);}to{opacity:1;transform:translateX(0);}}
  @keyframes slideInFromLeft{from{opacity:0;transform:translateX(-36px);}to{opacity:1;transform:translateX(0);}}

  @media (prefers-reduced-motion: reduce){
    .view.dir-forward,.view.dir-back{animation:none;}
    .card,.resource-item{animation:none;opacity:1;transform:none;}
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width:768px){
    .card-grid{grid-template-columns:1fr;}
    .hero{min-height:64vh;}
    .hero h1{font-size:34px;}
    .subhero-watermark{width:380px;right:-20%;opacity:0.08;}
    .platform-card{flex-direction:column;align-items:flex-start;text-align:left;}
    .header-inner{padding:16px 20px;flex-direction:column;align-items:flex-start;gap:10px;}
    .wrap,.hero-content,.header-inner{padding-left:20px;padding-right:20px;}
    .resource-item{flex-wrap:wrap;}
    .resource-cta{margin-left:64px;}
  }
</style>
</head>

  function renderResourcePage(cfg){
    const wm = WATERMARKS[cfg.watermark] || '';
    let itemsHtml = '';

    cfg.items.forEach(item => {
      itemsHtml += `
        <a class="resource-item" href="${item.href}" target="_blank" rel="noopener">
          <div class="resource-icon">${iconWrap(item.icon,20)}</div>
          <div class="resource-body">
            <span class="tag">${item.tag}</span>
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
          </div>
          <span class="resource-cta">Abrir ${iconWrap('external',15)}</span>
        </a>
      `;
    });

    let platformHtml = '';
    if (cfg.platform){
      const p = cfg.platform;
      platformHtml = `
        <div class="section-title" style="margin-top:36px;">Plataforma de viáticos</div>
        <a class="platform-card" href="${p.href}" target="_blank" rel="noopener">
          <div class="platform-logo-box">${iconWrap(p.icon,22)}</div>
          <div class="platform-body">
            <span class="tag">${p.tag}</span>
            <h4>${p.title}</h4>
            <p>${p.desc}</p>
          </div>
          <span class="resource-cta">Ir al portal ${iconWrap('external',15)}</span>
        </a>
      `;
    }

    let pendingHtml = '';
    if (cfg.pending){
      pendingHtml = `
        <div class="callout">
          <div class="callout-icon">${iconWrap('folder',18)}</div>
          <p><strong>Este servicio está en proceso de definición.</strong> El enlace o formulario correspondiente se habilitará próximamente en este espacio.</p>
        </div>
      `;
    }

    return `
      <div class="subhero">
        <div class="subhero-watermark">${wm}</div>
        <div class="wrap subhero-content">
          <span class="subhero-eyebrow">${cfg.eyebrow}</span>
          <h2>${cfg.title}</h2>
          <p>${cfg.desc}</p>
        </div>
      </div>

      <div class="wrap">
        <section class="block">
          ${cfg.items.length ? `<div class="section-title">Recursos</div><div class="resource-list">${itemsHtml}</div>` : ''}
          ${pendingHtml}
          ${platformHtml}
        </section>

  function renderBreadcrumb(){
    const bc = document.getElementById('breadcrumb');
    let html = '';
    history.forEach((key, idx) => {
      const route = routes[key];
      const isLast = idx === history.length - 1;
      if (idx > 0){
        html += `<span class="sep">${iconWrap('chevron',13)}</span>`;
      }
      if (isLast){
        html += `<span class="crumb-current">${route.title}</span>`;
      } else {
        html += `<button data-crumb="${idx}">${route.title}</button>`;
      }
    });
    bc.innerHTML = html;
    bc.querySelectorAll('[data-crumb]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-crumb'), 10);
        history = history.slice(0, idx + 1);
        renderCurrent('back');
      });
    });
  }

  function renderCurrent(dir){
    const key = history[history.length - 1];
    const route = routes[key];
    const main = document.getElementById('main-views');
    main.innerHTML = `<div class="view active dir-${dir}">${route.render()}</div>`;
    renderBreadcrumb();
    bindNavTriggers();
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }

  function bindNavTriggers(){
    document.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => {
        const target = el.getAttribute('data-nav');
        const dir = el.getAttribute('data-dir') || 'forward';
        history.push(target);
        renderCurrent(dir);
      });
    });
  }

  renderCurrent('forward');
})();
</script>
